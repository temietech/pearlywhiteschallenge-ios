name: Export iOS and Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show runner and select Xcode 26
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "ERROR: No Xcode 26 found on this runner"
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Setup Godot Engine
        run: |
          curl -LO https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip
          unzip -q Godot_v4.7-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.stable"
          curl -LO https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -q Godot_v4.7-stable_export_templates.tpz
          mv templates/* "$HOME/Library/Application Support/Godot/export_templates/4.7.stable/"
          ls "$HOME/Library/Application Support/Godot/export_templates/4.7.stable/" | grep -i ios

      - name: Install Certificates and Provisioning Profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=temp_password
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Configure iOS signing in export preset
        run: |
          PROFILE=~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          security cms -D -i "$PROFILE" > $RUNNER_TEMP/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' $RUNNER_TEMP/profile.plist)
          PROFILE_APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' $RUNNER_TEMP/profile.plist)
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          echo "Profile name:      $PROFILE_NAME"
          echo "Profile app id:    $PROFILE_APPID"
          echo "Signing identity:  $IDENTITY"
          echo "Preset bundle id:  $(grep -m1 'application/bundle_identifier' export_presets.cfg)"
          sed -i '' "s|^application/code_sign_identity_release=.*|application/code_sign_identity_release=\"$IDENTITY\"|" export_presets.cfg
          sed -i '' "s|^application/provisioning_profile_specifier_release=.*|application/provisioning_profile_specifier_release=\"$PROFILE_NAME\"|" export_presets.cfg

      - name: Import Assets and Export Godot iOS Project
        run: |
          set -o pipefail
          mkdir -p build/ios
          # Pass 1: import all assets into .godot/ (it is gitignored, so CI starts empty)
          /Applications/Godot.app/Contents/MacOS/Godot --headless --editor --quit > build/import.log 2>&1 || true
          # Pass 2: export (progress spam removed so the real error is visible)
          if ! /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/PearlyWhites.ipa > build/export.log 2>&1; then
            echo "=========== EXPORT FAILED - relevant lines ==========="
            grep -vE '^\[ *[0-9]+% \]|^\[ DONE \]|Invalid plugin config|savepack|reimport|_update_scan' build/export.log | tail -60
            exit 1
          fi
          ls -la build/ios

      - name: Upload to App Store Connect / TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8_BASE64: ${{ secrets.APPSTORE_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          xcrun altool --upload-app -f build/ios/PearlyWhites.ipa -t ios --apiKey ${{ secrets.APPSTORE_KEY_ID }} --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}